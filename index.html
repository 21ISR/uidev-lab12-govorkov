<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="https://i.pinimg.com/736x/44/1d/1f/441d1f100fcdefffbba4ea6226254fa3.jpg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>LogIn</title>
    <link rel="stylesheet" href="reset.css"/> 
    <link rel="stylesheet" href="style.css"/> 
</head>
<body>
    <header>
        <h1>
            Student Login
        </h1>
        <p class="head-p">
            Access your student account
        </p>
    </header>
    <main>
        <section>
            <h2>
                Email or Student ID
            </h2>
            <input type="email" class="inputs" placeholder="Enter your email or Student ID">
        </section>
        <section>
            <h2>
                Password
            </h2>
            <p>
                <input type="password" class="inputs" placeholder="Enter your password">
            </p>
        </section>
        <section>    
            <p class="space-between">
                <span>
                    <input type="checkbox" id="check"/>
                    <label for="check">Remember me</label>
                </span>
                <span>
                    <a href="">Forgot password?</a>
                </span>
            </p>
        </section>
        <section>
            <button class="login-button">
                Log In
            </button>
        </section>
        <!--а вот тут начинается--> 
        <section class="hr-sect">
            <div class="hr">
            </div>
            <p class="text-in-hr">
                OR
            </p>
        </section>   
        
        <section>
            <button>
                <img src="assets/icons8-google.svg" alt="ббб, ливай отсюад">
            </button>
            <button>
                <img src="assets/icons8-windows-11.svg" alt="ббб, ливай отсюад">
            </button>
            <button>
                <img src="assets/icons8-apple-inc.svg" alt="ббб, ливай отсюад">
            </button>
        </section>
        <section>
            <p>
            Don`t have an account? <a href="">Register</a>
            </p> 
        </section>
    </main>
</body>
</html>
