<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="https://i.pinimg.com/736x/44/1d/1f/441d1f100fcdefffbba4ea6226254fa3.jpg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>LogIn</title>
    <link rel="stylesheet" href="reset.css"/>
    <link rel="stylesheet" href="style.css"/> 
</head>
<body>
    <header class="shadow">
        <h1>
            Student Login
        </h1>
        <p class="head-p">
            Access your student account
        </p>
    </header>
    <main class="shadow">
        <section>
            <form method="POST" action="/api/login">
                <label for="email">Email or student ID</label>
                <input id="email" class="inputs" type="email" placeholder="Enter your email or student ID" name="email" required/>
                <label for="password">Password</label>
                <input id="password" class="inputs" type="password" placeholder="Enter your password" name="password" required/>
              
            <p class="space-between">
                <span>
                    <input type="checkbox" id="check" required/>
                    <label for="check">Remember me</label>
                </span>
                <span>
                    <a href="">Forgot password?</a>
                </span>
            </p>
            <button class="login-button">
                Log In
            </button>
            </form>
        </section>
        <!--а вот тут начинается--> 
        <section class="hr-sect">
            <div class="hr_div">
                <span class="hr"></span>
                <span class="text_ht">OR</span>
                <span class="hr"></span>
            </div>    
        </section>   
        
        <section class="buttons">
            <button class="links">
                <img src="assets/icons8-google (1).svg" alt="ббб, ливай отсюад">
            </button>
            <button class="links">
                <img src="assets/icons8-windows.svg" alt="ббб, ливай отсюад">
            </button>
            <button class="links">
                <img src="assets/icons8-apple-inc.svg" alt="ббб, ливай отсюад">
            </button>
        </section>
        <section>
            <p class="register-link">
            Don`t have an account? <a href="">Register</a>
            </p> 
        </section>
    </main>
</body>
</html>
