<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="https://i.pinimg.com/736x/44/1d/1f/441d1f100fcdefffbba4ea6226254fa3.jpg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>LogIn</title>
    <link rel="stylesheet" href="reset.css"/>
    <link rel="stylesheet" href="style.css"/> 
</head>
<body>
    <div class="container">
        <header class="shadow">
            <h1>
                Student registration
            </h1>
            <p class="head-p">
                Create your student account
            </p>
        </header>
        <main class="shadow">
            <section>
                <form method="POST" action="/api/login">
                    <label for="email">Full Name</label>
                    <input id="email" class="inputs" type="email" placeholder="Enter your full name" name="email" required/>
                    <label for="password">Email Address</label>
                    <input id="password" class="inputs" type="password" placeholder="Enter your email" name="password" required/>
                    <label for="password">Student ID</label>
                    <input id="password" class="inputs" type="password" placeholder="Enter your student ID" name="password" required/>
                    

                    <label for="xleb" class="cool-form">Selected Program</label>
                    <select id="xleb" name="xleb" class="cool-form" name="Choose ponos">
                        <option value="ПРивект">Computer Science</option>
                        <option value="ПРивект">Engineering</option>
                        <option value="ПРивект">Business</option>
                        <option value="ПРивект">Arts & Humanities</option>
                        <option value="ПРивект">Science</option>
                    </select>
                    <label for="password">Password</label>
                    <input id="password" class="inputs" type="password" placeholder="Create a password" name="password" required/>
                    <label for="password">Confirm Password</label>
                    <input id="password" class="inputs" type="password" placeholder="Confirm your password" name="password" required/>
                  
                <p class="space-between">
                    <span>
                        <input type="checkbox" id="rememeber_me" name="remember" required/>
                        <label for="rememeber_me">Remember me</label>
                    </span>
                    <span>
                        <a href="">Forgot password?</a>
                    </span>
                </p>
                <button class="login-button">
                    Log In
                </button>
                </form>
            </section>
            <!--а вот тут начинается--> 
            <section class="hr-sect">
                <div class="hr_div">
                    <span class="hr"></span>
                    <span class="text_ht">OR</span>
                    <span class="hr"></span>
                </div>    
            </section>   
            
            <section class="buttons">
                <button class="links">
                    <img src="assets/icons8-google (1).svg">
                </button>
                <button class="links">
                    <img src="assets/icons8-windows.svg">
                </button>
                <button class="links">
                    <img src="assets/icons8-apple-inc.svg">
                </button>
            </section>
            <section>
                <p class="register-link">
                Don`t have an account? <a href="">Register</a>
                </p> 
            </section>
        </main>
    </div>
</body>
</html>
