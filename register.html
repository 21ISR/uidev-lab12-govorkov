<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="https://i.pinimg.com/736x/44/1d/1f/441d1f100fcdefffbba4ea6226254fa3.jpg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Register</title>
    <link rel="stylesheet" href="reset.css"/>
    <link rel="stylesheet" href="style.css"/> 
</head>
<body>
    <div class="container">
        <header class="shadow">
            <h1>
                Student registration
            </h1>
            <p class="head-p">
                Create your student account
            </p>
        </header>
        <main class="shadow">
            <section>
                <form method="POST" action="/api/login">
                    <label for="name">Full Name</label>
                    <input id="name" class="inputs" type="name" placeholder="Enter your full name" name="fullname" required/>

                    <label for="email">Email Address</label>
                    <input id="email" class="inputs" type="email" placeholder="Enter your email" name="email" required/>

                    <label for="number">Student ID</label>
                    <input id="number" class="inputs" type="number" placeholder="Enter your student ID" name="student-id" required/>
                    

                    <label for="xleb" class="cool-form">Selected Program</label>
                    <select id="xleb" name="program" class="inputs">
                        <option value="Crutch" hidden>Choose your program</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Business">Business</option>
                        <option value="Arts & Humanities">Arts & Humanities</option>
                        <option value="Science">Science</option>
                    </select>
                    <label for="password">Password</label>
                    <input id="password" class="inputs" type="password" placeholder="Create a password" name="password" required/>

                    <label for="password">Confirm Password</label>
                    <input id="password" class="inputs" type="password" placeholder="Confirm your password" required/>
                  
                <p>
                    <span>
                        <input type="checkbox" id="rememeber_me" name="terms" required/>
                        <label for="rememeber_me">I agree to the Terms of service and Privacy Policy</label>
                    </span>
                </p>
                <button class="login-button">
                    Create Account
                </button>
                </form>
            </section>  
            <section>
                <p class="register-link">
                Already have an account? <a href="">Log in</a>
                </p> 
            </section>
        </main>
    </div>
</body>
</html>
